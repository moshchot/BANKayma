../libreerp-git:
  defaults:
    depth: 1000
  merges:
    - oca 18.0
    - hbrunn 18.0-res.users-context_get-disable-prefetch-ocb
  remotes:
    oca: https://github.com/OCA/OCB.git
    hbrunn: https://github.com/hbrunn/OCB.git
  shell_command_after:
    "app=$(basename $(realpath ..)); if [ ! -L ../$app ]; then mv ../$app
    ../$app-default;  ln -s libreerp-git ../$app; fi"
